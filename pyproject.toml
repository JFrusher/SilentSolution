[project]
name = "silent-solution"
version = "0.4.0"
description = "Submarine sonar and fire-control simulator: you never see the ocean, only the instruments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jacob Frusher", email = "jacob.frusher@cil-uk.co.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pygame-ce>=2.5.8",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]  # first-party modules for import sorting

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E731",  # inline lambdas in the key-action tables read better than named one-liners
    "B905",  # zip(strict=) would turn a harmless draw-time length mismatch into a crash
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
