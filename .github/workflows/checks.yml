name: checks

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: xvfb-run -a uv run checks.py  # the control room needs OpenGL: Mesa renders it in software
